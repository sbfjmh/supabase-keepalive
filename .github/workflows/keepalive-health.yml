name: Health Tracker Keepalive

on:
  schedule:
    - cron: '30 0 * * *'   # UTC 00:30 = 北京 08:30
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 查询 Supabase 保活
        env:
          URL: ${{ secrets.HEALTH_SUPABASE_URL }}
          KEY: ${{ secrets.HEALTH_SUPABASE_KEY }}
        run: |
          URL="${URL%/}"
          code=$(curl -sS --max-time 20 -o /tmp/resp.txt -w '%{http_code}' \
            -H "apikey: $KEY" \
            "$URL/rest/v1/items?select=*&limit=1")
          echo "HTTP $code"
          cat /tmp/resp.txt
          [ "$code" = "200" ] || exit 1
