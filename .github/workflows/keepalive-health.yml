# 记录健康小程序 - Supabase 数据库保活定时任务
# 每天自动查询一次 Supabase 数据库，防止免费版因长时间不活动被暂停

name: Health Tracker Keepalive

on:
  # 每天北京时间 08:30 执行（UTC 00:30），与原项目错开 30 分钟
  schedule:
    - cron: '30 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 执行保活脚本
        env:
          HEALTH_SUPABASE_URL: ${{ secrets.HEALTH_SUPABASE_URL }}
          HEALTH_SUPABASE_KEY: ${{ secrets.HEALTH_SUPABASE_KEY }}
        run: node supabase-keepalive/scripts/keepalive-health.js
